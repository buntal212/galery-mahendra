name: Deploy Nuxt SSR

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to HOMELAB
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22

          script: |
            set -e

            echo "======================================"
            echo " Deploy Galery Mahendra"
            echo "======================================"

            NODE_PATH="/www/server/nodejs/v22.20.0/bin"
            PROJECT="/www/wwwroot/galery-mahendra"

            echo "=== Update source from GitHub ==="

            sudo -u www -H bash -c "
              export PATH='$NODE_PATH:\$PATH'
              cd '$PROJECT'

              git config --global --add safe.directory '$PROJECT'

              git fetch origin main
              git reset --hard origin/main
            "

            echo "=== Install dependencies ==="

            sudo -u www -H bash -c "
              export PATH='$NODE_PATH:\$PATH'
              cd '$PROJECT'

              npm ci
            "

            echo "=== Build Nuxt SSR ==="

            sudo -u www -H bash -c "
              export PATH='$NODE_PATH:\$PATH'
              cd '$PROJECT'

              npm run build
            "

            echo "=== Restart PM2 ==="

            sudo -u www -H env PATH="$NODE_PATH:$PATH" \
              pm2 restart galery_mahendra --update-env

            echo "=== Save PM2 ==="

            sudo -u www -H env PATH="$NODE_PATH:$PATH" \
              pm2 save

            echo "=== PM2 Status ==="

            sudo -u www -H env PATH="$NODE_PATH:$PATH" \
              pm2 status galery_mahendra

            echo "======================================"
            echo " DEPLOY SUCCESS"
            echo "======================================"
